service: cloudS3apidb
provider: 
  name: aws
  stage: prod
  runtime: go1.x
  region: ap-northeast-1

package:
  exclude:
    - ./**
  include:
    - ./bin/**

functions:
  listProject:
    handler: bin/project
    events:
      - http:
          path: /project
          method: get
          cors: true

  getProject:
    handler: bin/project
    events:
      - http:
          path: /project/{id}
          method: get
          cors: true

  listInvoice:
    handler: bin/project
    events:
      - http:
          path: /project
          method: get
          cors: true

  getInvoice:
    handler: bin/invoice
    events:
      - http:
          path: /invoice/{id}
          method: get
          cors: true
