service: s3db
provider: 
  name: aws
  stage: prod
  runtime: go1.x
  region: ap-northeast-1

package:
  exclude:
    - ./**
  include:
    - ./bin/**

functions:
  list:
    handler: bin/main
    events:
      - http:
          path: /api
          method: get
          cors: true

  get:
    handler: bin/main
    events:
      - http:
          path: /api/{id}
          method: get
          cors: true

