service: cloudS3apidb
provider: 
  name: aws
  stage: prod
  runtime: go1.x
  region: ap-northeast-1

package:
  exclude:
    - ./**
  include:
    - ./bin/**

plugins:
  - serverless-offline
  - serverless-static

functions:
  listProject:
    handler: bin/handler/project
    events:
      - http:
          path: /project
          method: get
          cors: true

  getProject:
    handler: bin/handler/project
    events:
      - http:
          path: /project/{id}
          method: get
          cors: true

custom:
  static:
    path: ./public
    port: 8000
