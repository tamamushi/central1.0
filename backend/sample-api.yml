# vim:set ts=2 st=2 expandtab fenc=utf-8:

swagger: '2.0'

info:
  description: |
    swaggerテスト用YAMLファイル
  version: 1.0.0
  title: Swagger テスト

schemes:
- http

paths:
  /projects:
    get:
      summary: プロジェクトの一覧を取得
      description: Projectオブジェクトの一覧を返す
      operationId: getProjects
      produces:
      - application/json
      responses:
        200:
          description: successful operation
          schema:
            type: array
            items:
              $ref: '#/definitions/Project'
  /projects/{projectId}:
    get:
      summary: IDを指定してProjectを取得
      description: Projectオブジェクトを返す
      operationId: getProjectsById
      produces:
      - application/json
      parameters:
      - name: projectId
        in: path
        description: 指定されたIDのProjectオブジェクトを返す
        required: true
        type: integer
        format: int64
      responses:
        200:
          description: successful operation
          schema:
            $ref: '#/definitions/Project'
        400:
          description: Invalid ID supplied
        404:
          description: Pet not found

# モデル定義の記述
definitions:
  Project:
    type: object
    required:
    - id
    - client_name
    - subject
    - create_date
    - delivery_date
    - delivery_method
    - payment_term
    - deliverables
    - conditions
    properties:
      id:
        type: integer
        format: int64
      client_name:
        type: string
        example: 株式会社エービーシー
      subject:
        type: string
        example: サンプルシステム開発
      create_date:
        type: string
        format: date
        example: 2018年1月31日
      delivery_date:
        type: string
        format: date
        example: 2018年5月31日
      delivery_method:
        type: string
        example: 御社指定サーバーへデプロイ
      payment_term:
        type: string
        example: 納品月の月末締め、翌々月10日に銀行振込での現金払い
      deliverables:
        type: string
        example: a.要件定義書
      conditions:
        type: string
        example: 諸条件A
