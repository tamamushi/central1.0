<!-- vim: set ts=4 sw=4 sts=4 et sta ai fenc=utf-8: -->
<div class="row">
    <div class="col-xs-12">
    <div class="box with-border">

        <div class="box-header">
            一覧
            <div class="box-tools">
            <div class="">
                <ul><li><a [routerLink]="create"><i class="fa fa-circle-o"></i><span>新規作成</span></a></li></ul>
            </div>
            <div class="input-group" style="width: 150px;">
                <input type="text" name="table_search" class="form-control input-sm pull-right" placeholder="Search">
                <div class="input-group-btn">
                    <button class="btn btn-sm btn-default"><i class="fa fa-search"></i></button>
                </div>
            </div>
            </div>
        </div><!-- /.box-header -->

        <div class="box-body table-responsive no-padding">
        <!-- <table class="table table-hover table-condensed"> -->
        <table class="table table-hover">
            <thead class="thead-dark"><tr>
                <th>ID</th>
                <th>ProjectNo</th>
                <th>Title</th>
                <th>CompanyName</th>
                <th>Date</th>
                <th>Status</th>
                <th>Reason</th>
            </tr></thead>
            <tr *ngFor="let invoice of invoices; let i = index">
                <td>{{invoice.id}}</td>
                <td>{{invoice.project_no}}</td>
                <td>{{invoice.title}}</td>
                <td>{{invoice.client_name}}</td>
                <td>{{invoice.create_date |date:"yyyy/MM/dd"}}</td>
                <td><span class="label label-success">Approved</span></td>
                <td><a [routerLink]="['detail', invoice.id]">編集</a></td>
            </tr>
        </table>
        </div><!-- /.box-body -->
    </div><!-- /.box -->
    </div>
</div>
